<text x="162" y="440" font-size="19" text-anchor="middle" font-weight="normal">重新查券 + 核价</text>
<text x="162" y="476" font-size="19" text-anchor="middle" font-weight="normal">价格变了?</text>
<text x="162" y="512" font-size="19" text-anchor="middle" font-weight="normal">¥20→¥23 回到摘要</text>
<rect x="322" y="345" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="322" y="345" width="264" height="56" rx="14" fill="#DA291C"/>
<rect x="322" y="385" width="264" height="16" fill="#DA291C"/>
<text x="454" y="383" font-size="23" text-anchor="middle" font-weight="bold" fill="#FFFFFF">⑥ 你再确认下单</text>
<text x="454" y="440" font-size="19" text-anchor="middle" font-weight="normal">对新摘要再确认</text>
<text x="454" y="476" font-size="19" text-anchor="middle" font-weight="normal">官方真实写:终端亲手输入</text>
<text x="454" y="512" font-size="19" text-anchor="middle" font-weight="normal">确认短语;旧确认作废</text>
<rect x="614" y="345" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="4"/>
<rect x="614" y="345" width="264" height="56" rx="14" fill="#FFC72C"/>
<rect x="614" y="385" width="264" height="16" fill="#FFC72C"/>
<text x="746" y="383" font-size="23" text-anchor="middle" font-weight="bold" fill="#3A2A1A">⑦ 创建待支付订单</text>
<text x="746" y="440" font-size="19" text-anchor="middle" font-weight="normal">create-order 仅 1 次</text>
<text x="746" y="476" font-size="19" text-anchor="middle" font-weight="normal">订单号只显示一次</text>
<text x="746" y="512" font-size="19" text-anchor="middle" font-weight="normal">状态:待支付</text>
<rect x="906" y="345" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/>
<rect x="906" y="345" width="264" height="56" rx="14" fill="#2E7D32"/>
<rect x="906" y="385" width="264" height="16" fill="#2E7D32"/>
<text x="1038" y="383" font-size="23" text-anchor="middle" font-weight="bold" fill="#FFFFFF">⑧ 你自己付款</text>
<text x="1038" y="440" font-size="19" text-anchor="middle" font-weight="normal">本工具不付款</text>
<text x="1038" y="476" font-size="19" text-anchor="middle" font-weight="normal">也不取消订单</text>
<text x="1038" y="512" font-size="19" text-anchor="middle" font-weight="normal">在 App 里完成</text>
