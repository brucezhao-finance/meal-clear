<text x="1170" y="44" font-size="20" text-anchor="end" fill="#FFC72C" font-weight="bold">模拟数据 · 官方真实写默认关闭</text>
<rect x="30" y="95" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="4"/>
<rect x="30" y="95" width="264" height="56" rx="14" fill="#FFC72C"/>
<rect x="30" y="135" width="264" height="16" fill="#FFC72C"/>
<text x="162" y="133" font-size="23" text-anchor="middle" font-weight="bold" fill="#3A2A1A">① 预览比价排名</text>
<text x="162" y="190" font-size="19" text-anchor="middle" font-weight="normal">只读,不领券不下单</text>
<text x="162" y="226" font-size="19" text-anchor="middle" font-weight="normal">多方案 + 理由</text>
<text x="162" y="262" font-size="19" text-anchor="middle" font-weight="normal">1–50 人</text>
<rect x="322" y="95" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="4"/>
<rect x="322" y="95" width="264" height="56" rx="14" fill="#FFC72C"/>
<rect x="322" y="135" width="264" height="16" fill="#FFC72C"/>
<text x="454" y="133" font-size="23" text-anchor="middle" font-weight="bold" fill="#3A2A1A">② 订单摘要</text>
<text x="454" y="190" font-size="19" text-anchor="middle" font-weight="normal">核价 ¥20.00</text>
<text x="454" y="226" font-size="19" text-anchor="middle" font-weight="normal">摘要编号 digest</text>
<text x="454" y="262" font-size="19" text-anchor="middle" font-weight="normal">600 秒内有效</text>
<rect x="614" y="95" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="614" y="95" width="264" height="56" rx="14" fill="#DA291C"/>
<rect x="614" y="135" width="264" height="16" fill="#DA291C"/>
<text x="746" y="133" font-size="23" text-anchor="middle" font-weight="bold" fill="#FFFFFF">③ 你确认领券</text>
<text x="746" y="190" font-size="19" text-anchor="middle" font-weight="normal">一键领全部 · 不可撤销</text>
<text x="746" y="226" font-size="19" text-anchor="middle" font-weight="normal">官方真实写:要在你自己的</text>
<text x="746" y="262" font-size="19" text-anchor="middle" font-weight="normal">终端亲手输入确认短语</text>
<rect x="906" y="95" width="264" height="190" rx="14" fill="#FFFFFF" stroke="#FFC72C" stroke-width="4"/>
