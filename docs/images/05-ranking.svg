<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="rk-t rk-d">
<title id="rk-t">多方案排名:为什么这么排</title>
<desc id="rk-d">模拟数据 demo-multi 的 3 人到店自取结果:第1名 52.50 元偏好 1/3 依赖券;第2名 53.00 元偏好 0/3 不依赖券;第3名 53.50 元偏好 2/3 依赖券。排序规则:门槛、总价、偏好、新购卡、券依赖、编号。共检查 105 个候选,不是全局最优。排名阶段只读,不下单。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif} text:not([fill]){fill:#3A2A1A} .m{font-family:Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace}</style>
<rect width="1200" height="640" fill="#FFF8E1"/>
<rect x="0" y="0" width="1200" height="70" fill="#DA291C"/>
<g transform="translate(24,10) scale(0.6)"><rect width="96" height="80" rx="16" fill="#DA291C"/><path d="M14 62 C14 14 48 14 48 62 C48 14 82 14 82 62" fill="none" stroke="#FFC72C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="90" y="46" font-size="30" text-anchor="start" font-weight="bold" fill="#FFFFFF">多方案排名:为什么这么排</text>
<text x="1170" y="44" font-size="20" text-anchor="end" fill="#FFC72C" font-weight="bold">模拟数据 · demo-multi · 3人预算70元</text>
<rect x="30" y="90" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/>
<circle cx="84" cy="155" r="34" fill="#2E7D32"/>
<text x="84" y="168" font-size="38" text-anchor="middle" font-weight="bold" fill="#FFFFFF">1</text>
<text x="140" y="142" font-size="38" text-anchor="start" font-weight="bold">¥52.50</text>
<text x="330" y="140" font-size="22" text-anchor="start" font-weight="normal">—</text>
<text x="140" y="178" font-size="22" text-anchor="start" font-weight="normal">偏好 1/3 · 依赖 1 张券</text>
<text x="140" y="206" font-size="20" text-anchor="start" font-weight="normal">总价最低；依赖未领取的券，券不计入报价</text>
<rect x="30" y="235" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<circle cx="84" cy="300" r="34" fill="#DA291C"/>
<text x="84" y="313" font-size="38" text-anchor="middle" font-weight="bold" fill="#FFFFFF">2</text>
<text x="140" y="287" font-size="38" text-anchor="start" font-weight="bold">¥53.00</text>
<text x="330" y="285" font-size="22" text-anchor="start" font-weight="normal">比第1名 +¥0.50</text>
<text x="140" y="323" font-size="22" text-anchor="start" font-weight="normal">偏好 0/3 · 不依赖券</text>
<text x="140" y="351" font-size="20" text-anchor="start" font-weight="normal">不靠券也能买到，只贵 ¥0.50</text>
<rect x="30" y="380" width="740" height="130" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<circle cx="84" cy="445" r="34" fill="#DA291C"/>
<text x="84" y="458" font-size="38" text-anchor="middle" font-weight="bold" fill="#FFFFFF">3</text>
<text x="140" y="432" font-size="38" text-anchor="start" font-weight="bold">¥53.50</text>
<text x="330" y="430" font-size="22" text-anchor="start" font-weight="normal">比第2名 +¥0.50</text>
<text x="140" y="468" font-size="22" text-anchor="start" font-weight="normal">偏好 2/3 · 依赖 1 张券</text>
<text x="140" y="496" font-size="20" text-anchor="start" font-weight="normal">偏好最多（2/3），但比第1名贵 ¥1.00</text>
<rect x="800" y="90" width="370" height="437" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="800" y="90" width="370" height="52" rx="14" fill="#DA291C"/><rect x="800" y="126" width="370" height="16" fill="#DA291C"/>
<text x="985" y="127" font-size="26" text-anchor="middle" font-weight="bold" fill="#FFFFFF">排序规则</text>
<text x="826" y="185" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">1</text>
<text x="860" y="185" font-size="19" text-anchor="start" font-weight="normal">门槛:硬要求全部已核实、预算内</text>
<text x="826" y="237" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">2</text>
<text x="860" y="237" font-size="21" text-anchor="start" font-weight="normal">总价,从低到高</text>
<text x="826" y="289" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">3</text>
<text x="860" y="289" font-size="21" text-anchor="start" font-weight="normal">偏好满足数,多的在前</text>
<text x="826" y="341" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">4</text>
<text x="860" y="341" font-size="21" text-anchor="start" font-weight="normal">新购卡,少的在前</text>
<text x="826" y="393" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">5</text>
<text x="860" y="393" font-size="21" text-anchor="start" font-weight="normal">依赖券,少的在前</text>
<text x="826" y="445" font-size="24" text-anchor="start" font-weight="bold" fill="#DA291C">6</text>
<text x="860" y="445" font-size="21" text-anchor="start" font-weight="normal">方案编号(保证稳定)</text>
<text x="826" y="484" font-size="19" text-anchor="start" font-weight="normal">共检查 105 个候选(搜索空间 392)</text>
<text x="826" y="510" font-size="18" text-anchor="start" font-weight="bold" fill="#DA291C">已检查范围内排名,不是全局最优</text>
<rect x="30" y="535" width="1140" height="80" rx="14" fill="#FFC72C"/>
<text x="600" y="570" font-size="24" text-anchor="middle" font-weight="bold">模拟数据 · 排名阶段只读,不下单 · 未领取的券不计入报价</text>
<text x="600" y="600" font-size="19" text-anchor="middle" font-weight="normal">非麦当劳官方产品 · 拱形图标为自制示意 · 真实价格以官方当次核价为准</text>
</svg>
