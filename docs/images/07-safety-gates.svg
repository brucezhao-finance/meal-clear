<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" role="img" aria-labelledby="sg-t sg-d">
<title id="sg-t">安全闸门:四道门、上限与永久拒绝</title>
<desc id="sg-d">四道门缺一不可:一要带 --execute;二要提供与记录匹配且未过期的摘要编号;三要写目标固定为本机回环或官方端点;四仅限官方端点,要打开真实写开关、在自己的终端亲手输入确认短语、且不超过金额与次数上限。官方真实写默认关闭、未经真实验证。终端检查无法区分真人与伪终端。永远拒绝的工具包括 cancel-order、delivery-create-address、draw-lottery、mall-create-order、party-order-create(派对/活动预约)等。团餐没有独立下单工具,团餐的 create-order(beType=6)在官方端点被代码拒绝。模拟数据。图形为自制抽象图案,非官方标识。</desc>
<style>text{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif} text:not([fill]){fill:#3A2A1A} .m{font-family:Menlo,Consolas,'PingFang SC','Microsoft YaHei',monospace}</style>
<rect width="1200" height="690" fill="#FFF8E1"/>
<rect x="0" y="0" width="1200" height="70" fill="#DA291C"/>
<g transform="translate(24,10) scale(0.6)"><rect width="96" height="80" rx="16" fill="#DA291C"/><path d="M14 62 C14 14 48 14 48 62 C48 14 82 14 82 62" fill="none" stroke="#FFC72C" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></g>
<text x="90" y="46" font-size="30" text-anchor="start" font-weight="bold" fill="#FFFFFF">安全闸门:四道门缺一不可</text>
<text x="1170" y="44" font-size="20" text-anchor="end" fill="#FFC72C" font-weight="bold">模拟数据 · 官方真实写默认关闭</text>
<rect x="30" y="95" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="30" y="95" width="270" height="56" rx="14" fill="#DA291C"/>
<rect x="30" y="135" width="270" height="16" fill="#DA291C"/>
<text x="165" y="133" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">门 1 · 执行意图</text>
<text x="165" y="188" font-size="18" text-anchor="middle" font-weight="normal">必须带 --execute</text>
<text x="165" y="218" font-size="18" text-anchor="middle" font-weight="normal">没带 = 只做预演</text>
<text x="165" y="248" font-size="18" text-anchor="middle" font-weight="normal">预演不发写请求</text>
<rect x="320" y="95" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="320" y="95" width="270" height="56" rx="14" fill="#DA291C"/>
<rect x="320" y="135" width="270" height="16" fill="#DA291C"/>
<text x="455" y="133" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">门 2 · 摘要确认</text>
<text x="455" y="188" font-size="18" text-anchor="middle" font-weight="normal">完整 64 位摘要编号</text>
<text x="455" y="218" font-size="18" text-anchor="middle" font-weight="normal">须与记录匹配</text>
<text x="455" y="248" font-size="18" text-anchor="middle" font-weight="normal">且未过期(默认 600 秒)</text>
<rect x="610" y="95" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="610" y="95" width="270" height="56" rx="14" fill="#DA291C"/>
<rect x="610" y="135" width="270" height="16" fill="#DA291C"/>
<text x="745" y="133" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">门 3 · 固定目标</text>
<text x="745" y="188" font-size="18" text-anchor="middle" font-weight="normal">写目标固定:回环地址</text>
<text x="745" y="218" font-size="18" text-anchor="middle" font-weight="normal">或官方端点</text>
<text x="745" y="248" font-size="18" text-anchor="middle" font-weight="normal">其他地址发请求前拒绝</text>
<rect x="900" y="95" width="270" height="200" rx="14" fill="#FFFFFF" stroke="#B71C1C" stroke-width="4"/>
<rect x="900" y="95" width="270" height="56" rx="14" fill="#B71C1C"/>
<rect x="900" y="135" width="270" height="16" fill="#B71C1C"/>
<text x="1035" y="133" font-size="22" text-anchor="middle" font-weight="bold" fill="#FFFFFF">门 4 · 官方真实写</text>
<text x="1035" y="188" font-size="18" text-anchor="middle" font-weight="normal">开关默认关闭</text>
<text x="1035" y="218" font-size="18" text-anchor="middle" font-weight="normal">你在自己的终端亲手输入</text>
<text x="1035" y="248" font-size="18" text-anchor="middle" font-weight="normal">金额与次数上限</text>
<text x="1035" y="278" font-size="18" text-anchor="middle" font-weight="normal">(回环模拟不需要)</text>
<text x="600" y="325" font-size="20" text-anchor="middle" font-weight="bold">门全部满足,才会放行受控写工具:auto-bind-coupons(领券)· create-order(下单)</text>
<rect x="30" y="345" width="555" height="195" rx="14" fill="#FFFFFF" stroke="#DA291C" stroke-width="4"/>
<rect x="30" y="345" width="555" height="50" rx="14" fill="#DA291C"/>
<rect x="30" y="380" width="555" height="15" fill="#DA291C"/>
<text x="307" y="380" font-size="24" text-anchor="middle" font-weight="bold" fill="#FFFFFF">永远拒绝(任何门都不放行)</text>
<text x="60" y="428" font-size="20" text-anchor="start" font-weight="bold" fill="#DA291C">✕</text>
<text x="90" y="428" font-size="19" text-anchor="start" font-weight="normal">cancel-order · 取消订单</text>
<text x="60" y="452" font-size="20" text-anchor="start" font-weight="bold" fill="#DA291C">✕</text>
<text x="90" y="452" font-size="19" text-anchor="start" font-weight="normal">delivery-create-address · 新建地址</text>
<text x="60" y="476" font-size="20" text-anchor="start" font-weight="bold" fill="#DA291C">✕</text>
<text x="90" y="476" font-size="19" text-anchor="start" font-weight="normal">draw-lottery · 抽奖</text>
<text x="60" y="500" font-size="20" text-anchor="start" font-weight="bold" fill="#DA291C">✕</text>
<text x="90" y="500" font-size="19" text-anchor="start" font-weight="normal">mall-create-order · 积分商城下单</text>
<text x="60" y="524" font-size="20" text-anchor="start" font-weight="bold" fill="#DA291C">✕</text>
<text x="90" y="524" font-size="19" text-anchor="start" font-weight="normal">party-order-create · 派对/活动预约</text>
<rect x="615" y="345" width="555" height="195" rx="14" fill="#FFFFFF" stroke="#2E7D32" stroke-width="4"/>
<rect x="615" y="345" width="555" height="50" rx="14" fill="#2E7D32"/>
<rect x="615" y="380" width="555" height="15" fill="#2E7D32"/>
<text x="892" y="380" font-size="24" text-anchor="middle" font-weight="bold" fill="#FFFFFF">官方端点(默认关闭)</text>
<text x="892" y="424" font-size="20" text-anchor="middle" font-weight="bold">默认关闭 · 未经真实验证</text>
<text x="892" y="450" font-size="19" text-anchor="middle" font-weight="normal">开关未开:发请求前就拒绝</text>
<text x="892" y="476" font-size="19" text-anchor="middle" font-weight="normal">开启后仍要终端亲手确认</text>
<text x="892" y="502" font-size="19" text-anchor="middle" font-weight="normal">终端检查分不清真人与伪终端</text>
<text x="892" y="528" font-size="19" text-anchor="middle" font-weight="normal">团餐 create-order(beType=6)在此端点被拒</text>
<rect x="30" y="560" width="1140" height="100" rx="14" fill="#FFC72C"/>
<text x="600" y="598" font-size="24" text-anchor="middle" font-weight="bold">写前先落本地账本 · 失败或结果未知时绝不自动重试</text>
<text x="600" y="634" font-size="19" text-anchor="middle" font-weight="normal">拱形图标为自制示意 · 数字与场景为模拟数据 · 非麦当劳官方产品</text>
</svg>
