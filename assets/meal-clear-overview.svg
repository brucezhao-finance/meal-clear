<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">麦麦明白点：改一句，重新算</title>
<desc id="desc">模拟示意：A、B各19元，总价38元。B改为牛肉24元，A保持19元，总价43元，增加5元，仍在50元预算内。非真实菜单或价格。</desc>
<defs><style>text{font-family:'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif} .label{font-size:19px;fill:#aeb9c6}.body{font-size:23px;fill:#f6f2e9}.small{font-size:18px;fill:#aeb9c6}.money{font-size:64px;font-weight:700;fill:#f9ca61}</style></defs>
<rect width="1200" height="700" rx="28" fill="#111e2a"/>
<rect x="48" y="45" width="8" height="44" rx="4" fill="#f9ca61"/>
<text x="76" y="76" font-size="30" font-weight="700" fill="#f6f2e9">麦麦明白点</text>
<rect x="850" y="45" width="300" height="38" rx="19" fill="#28394a"/>
<text x="1000" y="70" text-anchor="middle" font-size="17" fill="#f9ca61">模拟演示 · 非真实菜单 / 价格</text>
<text x="48" y="151" font-size="46" font-weight="700" fill="#f6f2e9">改一个人的口味，保留其他人的要求。</text>
<text x="48" y="194" font-size="23" fill="#aeb9c6">逐人核对 → 比较方案 → 改一句 → 重新核价</text>
<rect x="48" y="232" width="500" height="304" rx="20" fill="#1c2d3e" stroke="#35485a"/>
<text x="76" y="273" class="label">第一次选餐</text>
<text x="76" y="326" class="body">A  模拟鸡肉组合</text><text x="515" y="326" text-anchor="end" class="body">¥19</text>
<text x="76" y="373" class="body">B  模拟鸡肉组合</text><text x="515" y="373" text-anchor="end" class="body">¥19</text>
<path d="M76 399H520" stroke="#3b4c5e"/>
<text x="76" y="440" class="label">合计</text><text x="512" y="481" text-anchor="end" class="money">¥38</text>
<text x="76" y="503" class="small">两人不辣、无糖 · 预算 ¥50</text>
<path d="M572 382H624M609 368L624 382L609 396" fill="none" stroke="#f9ca61" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="650" y="232" width="500" height="304" rx="20" fill="#1c2d3e" stroke="#f9ca61" stroke-width="2"/>
<text x="678" y="273" font-size="19" fill="#f9ca61">“B 想吃牛肉，其他不变”</text>
<text x="678" y="326" class="body">A  原方案保留</text><text x="1117" y="326" text-anchor="end" class="body">¥19</text>
<text x="678" y="373" class="body">B  模拟牛肉组合</text><text x="1117" y="373" text-anchor="end" class="body">¥24</text>
<path d="M678 399H1122" stroke="#3b4c5e"/>
<text x="678" y="440" class="label">重新计算</text><text x="1114" y="481" text-anchor="end" class="money">¥43</text>
<text x="678" y="503" class="small">增加 ¥5 · 不辣、无糖与预算要求保留</text>
<rect x="48" y="564" width="1102" height="61" rx="12" fill="#243b3e"/>
<text x="599" y="603" text-anchor="middle" font-size="23" fill="#bde4cb">仍在预算内 · 要求逐项核对 · 真实模式重新取数与官方核价</text>
<text x="48" y="664" class="small">能力示意，非网页截图。接口未确认的属性保持未知；不自动下单。</text>
</svg>
